name: caja-link

x-caja: &caja
  build: ./mocks
  env_file: .env
  volumes:
    - ./mocks/data:/data:ro

services:
  caja-norte:
    <<: *caja
    environment:
      CAJA: norte
      PORT: "9001"
    ports:
      - "${CAJA_NORTE_PORT:-9001}:9001"

  caja-oriente:
    <<: *caja
    environment:
      CAJA: oriente
      PORT: "9002"
    ports:
      - "${CAJA_ORIENTE_PORT:-9002}:9002"

  # Cuarta caja: docker compose --profile caja-sur up -d
  caja-sur:
    <<: *caja
    profiles: ["caja-sur"]
    environment:
      CAJA: sur
      PORT: "9004"
    ports:
      - "${CAJA_SUR_PORT:-9004}:9004"

  # Servicio de interoperabilidad del equipo (puerto de contrato 8083).
  # Solo ve de las cajas lo que ellas publican: sus servicios por la red interna,
  # el archivo diario de Caja Centro y el catálogo de config/ (ambos de solo lectura).
  # No depende de que las cajas estén arriba: si una no responde, lo informa.
  caja-link:
    build: ./src
    env_file: .env
    ports:
      - "8083:8083"
    volumes:
      - ./caja-centro:/data/caja-centro:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Pruebas del equipo: docker compose --profile test run --rm tests
  # Prueban caja-link en funcionamiento por la red interna y dejan el reporte
  # JUnit XML en ./test-results/. Leen los tokens del .env, nunca escritos en el código.
  tests:
    build: ./tests
    profiles: ["test"]
    env_file: .env
    environment:
      CAJA_LINK_URL: http://caja-link:8083
    volumes:
      - ./test-results:/results
      # Solo lectura: la prueba de secretos revisa que ningún token o clave esté escrito aquí.
      - ./src:/repo/src:ro
      - ./config:/repo/config:ro
    depends_on:
      caja-link:
        condition: service_healthy
