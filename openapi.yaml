openapi: 3.0.3
info:
  title: Caja Link
  version: 2.0.0
  description: |
    Servicio de interoperabilidad entre cajas de compensación familiar. Una caja
    pregunta si un documento tiene afiliación vigente en otra caja, sin ver datos
    personales (Ley 1581): solo caja, vigencia, fuente y fecha de corte.

    Toda ruta, salvo `/health`, exige el token de la caja que consulta
    (`Authorization: Bearer <token>`). La auditoría solo se lee con el token de administrador.

    Para probar desde esta página: botón **Authorize**, pegar el token (sin la palabra
    Bearer), y en cada ruta **Try it out** y **Execute**. Cada respuesta trae ejemplos de
    sus distintas situaciones en el menú **Examples**.
servers:
  - url: http://localhost:8083
    description: Entorno local (docker compose)

security:
  - bearerAuth: []

tags:
  - name: Consulta en línea
    description: Consulta de un documento contra todas las cajas, en menos de 5 segundos.
  - name: Cruce por lote
    description: Envío de un archivo CSV con muchos documentos; se procesa en segundo plano.
  - name: Auditoría
    description: Registro de quién consultó, para qué y con qué resultado.
  - name: Salud
    description: Estado del servicio, sin token.

paths:
  /api/v1/affiliations/{document}:
    get:
      tags: [Consulta en línea]
      summary: Consulta de afiliación (v1)
      description: |
        Para las cajas consumidoras. Revisa el documento en todas las cajas excepto la
        que consulta y responde si tiene afiliación vigente en otra. Si alguna caja no
        responde y las demás no tienen el documento, el resultado es INDETERMINADO
        (nunca NO_AFILIADO) y esa caja aparece en `unavailable`.
      parameters:
        - $ref: '#/components/parameters/Document'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Resultado de la consulta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AffiliationResponseV1' }
              examples:
                afiliado:
                  summary: Tiene afiliación vigente en otra caja
                  value:
                    requestId: 01M4XGBNN1Z3WGVNQKA6YFJM6E
                    result: AFILIADO_OTRA_CAJA
                    matches:
                      - { caja: NORTE, validFrom: '2024-06-27', validTo: null, source: ONLINE, asOf: '2026-10-14' }
                    unavailable: []
                noAfiliado:
                  summary: Todas las cajas respondieron y ninguna la tiene
                  value: { requestId: 01M4Y17DXAZ20PYM9GDFAANRVM, result: NO_AFILIADO, matches: [], unavailable: [] }
                indeterminado:
                  summary: Caja Norte no respondió y las demás no la tienen (nunca se responde NO_AFILIADO)
                  value: { requestId: 01M4Y17E8X7TMAKJVXYGJGDG1G, result: INDETERMINADO, matches: [], unavailable: [NORTE] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }

  /api/v2/affiliations/{document}:
    get:
      tags: [Consulta en línea]
      summary: Consulta de afiliación (v2, con tipo de afiliado)
      description: |
        Igual a la v1, y cada coincidencia agrega `affiliateType` (DEPENDIENTE,
        INDEPENDIENTE o PENSIONADO). La v1 no cambia, para no romper a quien ya la usa.
      parameters:
        - $ref: '#/components/parameters/Document'
        - $ref: '#/components/parameters/Purpose'
      responses:
        '200':
          description: Resultado de la consulta con el tipo de afiliado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AffiliationResponseV2' }
              examples:
                afiliadoEnLinea:
                  summary: Afiliado en una caja consultada en línea
                  value:
                    requestId: 01M4Y17EP9SVMNF9CK9QXDPA8H
                    result: AFILIADO_OTRA_CAJA
                    matches:
                      - { caja: NORTE, validFrom: '2024-06-27', validTo: null, source: ONLINE, asOf: '2026-10-14', affiliateType: DEPENDIENTE }
                    unavailable: []
                afiliadoPorArchivo:
                  summary: Afiliado en Caja Centro, que informa por archivo del día anterior
                  value:
                    requestId: 01M4XGBNJXVA7P969CW9XSYWTP
                    result: AFILIADO_OTRA_CAJA
                    matches:
                      - { caja: CENTRO, validFrom: '2025-02-11', validTo: null, source: FILE, asOf: '2026-10-03', affiliateType: PENSIONADO }
                    unavailable: []
                indeterminado:
                  summary: La única caja donde está afiliado no respondió
                  value: { requestId: 01M4Y17EM8FPCAN149QXQW9XRM, result: INDETERMINADO, matches: [], unavailable: [NORTE] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }

  /api/v1/batch-checks:
    post:
      tags: [Cruce por lote]
      summary: Enviar un cruce por lote
      description: |
        Para las cajas consumidoras. Recibe un CSV con la columna `document` y responde
        de inmediato 202 con el `jobId`; el lote corre en segundo plano. Repetir el envío
        con la misma `Idempotency-Key` devuelve el mismo `jobId` sin procesarlo de nuevo.
        Máximo 5 MB y 100.000 documentos.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Llave que elige la caja para reenviar el lote sin duplicarlo (máximo 200 caracteres). Se recomienda enviarla siempre.
          schema: { type: string, maxLength: 200 }
          example: nomina-2026-10-14
        - name: purpose
          in: query
          required: false
          description: Finalidad del cruce. Si no se envía se registra VALIDACION_AFILIACION.
          schema: { $ref: '#/components/schemas/Purpose' }
          example: VALIDACION_AFILIACION
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "document\n8873901472\n999\nabc\n"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Archivo CSV con la columna document }
      responses:
        '202':
          description: Lote recibido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAccepted' }
              example: { jobId: 01M4XGBNS24474JSWGRJH2Z2RK, status: PENDING }
        '400':
          description: CSV vacío, sin la columna document, o formulario sin el campo file; o finalidad inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                sinColumna:
                  summary: El CSV no tiene la columna document
                  value: { error: CSV_INVALIDO, message: 'El archivo debe tener una columna llamada document' }
                vacio:
                  summary: El CSV no trae ningún documento
                  value: { error: CSV_VACIO, message: 'El archivo no trae documentos' }
                formularioSinArchivo:
                  summary: Se envió un formulario sin el campo file
                  value: { error: CSV_INVALIDO, message: 'El formulario debe traer el archivo en el campo file' }
                finalidadInvalida:
                  summary: Se envió una finalidad que no es de las permitidas
                  value: { error: FINALIDAD_INVALIDA, message: 'purpose debe ser uno de: TARIFA_SUBSIDIADA, SUBSIDIO_MONETARIO, VALIDACION_AFILIACION' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '413':
          description: El archivo pasa de 5 MB o de 100.000 documentos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: LOTE_DEMASIADO_GRANDE, message: El archivo supera el tamaño máximo permitido }

  /api/v1/batch-checks/{jobId}:
    get:
      tags: [Cruce por lote]
      summary: Estado y resultados de un lote
      description: |
        Para la caja que envió el lote (ninguna otra puede verlo). `status` pasa por
        PENDING, RUNNING y DONE; `results` va vacío hasta DONE y luego trae un resultado
        por documento, en el mismo orden del archivo.
      parameters:
        - name: jobId
          in: path
          required: true
          description: Identificador entregado al enviar el lote.
          schema: { type: string }
          example: 01M4XGBNS24474JSWGRJH2Z2RK
      responses:
        '200':
          description: Estado del lote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchJob' }
              examples:
                enCurso:
                  summary: El lote sigue procesándose; results va vacío hasta terminar
                  value: { jobId: 01M4Y17ET5G9SS29KX2H2K8NKC, status: RUNNING, total: 10000, processed: 788, results: [] }
                terminado:
                  summary: El lote terminó; un resultado por documento, en el orden del archivo
                  value:
                    jobId: 01M4XGBNS24474JSWGRJH2Z2RK
                    status: DONE
                    total: 3
                    processed: 3
                    results:
                      - document: '8873901472'
                        documentInput: '8.873.901.472'
                        result: AFILIADO_OTRA_CAJA
                        matches:
                          - { caja: NORTE, validFrom: '2024-06-27', validTo: null, source: ONLINE, asOf: '2026-10-14' }
                        unavailable: []
                      - { document: '999', documentInput: '999', result: NO_AFILIADO, matches: [], unavailable: [] }
                      - { document: abc, documentInput: abc, result: DOCUMENTO_INVALIDO, matches: [], unavailable: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: El lote no existe o pertenece a otra caja.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: LOTE_NO_ENCONTRADO, message: No existe un lote con ese jobId para esta caja }

  /api/v1/audit:
    get:
      tags: [Auditoría]
      summary: Auditoría de consultas (solo administrador)
      description: |
        Para el administrador. Últimas consultas respondidas, de la más nueva a la más
        vieja, en línea y por lote. El documento aparece enmascarado (solo los últimos
        4 dígitos).
      parameters:
        - name: limit
          in: query
          required: false
          description: Cuántas entradas devolver. Valores fuera de 1 a 1000 se ajustan al límite más cercano.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
          example: 100
      responses:
        '200':
          description: Entradas de auditoría.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
              example:
                - timestamp: '2026-10-14T15:26:40.801Z'
                  requestId: 01M4XGBNN1Z3WGVNQKA6YFJM6E
                  requestingCaja: ORIENTE
                  purpose: VALIDACION_AFILIACION
                  result: AFILIADO_OTRA_CAJA
                  documentMasked: '******1472'
                  channel: ONLINE
        '400':
          description: El parámetro limit no es un número.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: PETICION_INVALIDA, message: 'Revise los parámetros de la petición' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token es de una caja, no del administrador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: PROHIBIDO, message: La auditoría solo se consulta con el token de administrador }

  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio
      description: Responde si el servicio está arriba. No pide token; docker compose la usa para saber cuándo el servicio está listo.
      security: []
      responses:
        '200':
          description: El servicio está funcionando.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [UP] }
              example: { status: UP }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de la caja (NORTE_TOKEN, ORIENTE_TOKEN, CENTRO_TOKEN, SUR_TOKEN) o ADMIN_TOKEN para la auditoría.

  parameters:
    Document:
      name: document
      in: path
      required: true
      description: Número de documento. Se aceptan puntos, espacios y ceros a la izquierda; se normalizan antes de consultar.
      schema: { type: string }
      example: '8873901472'
    Purpose:
      name: purpose
      in: query
      required: true
      description: Finalidad de la consulta (obligatoria por la Ley 1581).
      schema: { $ref: '#/components/schemas/Purpose' }
      example: VALIDACION_AFILIACION

  responses:
    BadRequest:
      description: Falta la finalidad, la finalidad no es válida o el documento tiene caracteres no permitidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            finalidadRequerida:
              summary: No se envió purpose
              value: { error: FINALIDAD_REQUERIDA, message: 'El parámetro purpose es obligatorio: TARIFA_SUBSIDIADA, SUBSIDIO_MONETARIO, VALIDACION_AFILIACION' }
            finalidadInvalida:
              summary: purpose no es una de las finalidades permitidas
              value: { error: FINALIDAD_INVALIDA, message: 'purpose debe ser uno de: TARIFA_SUBSIDIADA, SUBSIDIO_MONETARIO, VALIDACION_AFILIACION' }
            documentoInvalido:
              summary: El documento tiene letras u otros caracteres no permitidos
              value: { error: DOCUMENTO_INVALIDO, message: 'El documento solo puede tener dígitos, puntos y espacios' }
    Unauthorized:
      description: Falta el token o no pertenece a ninguna caja.
      headers:
        WWW-Authenticate: { schema: { type: string }, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: NO_AUTENTICADO, message: 'Falta el token o no es válido (Authorization: Bearer <token>)' }
    ForbiddenAdmin:
      description: El token de administrador no puede consultar afiliaciones.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: PROHIBIDO, message: El token de administrador no puede consultar afiliaciones }

  schemas:
    Purpose:
      type: string
      enum: [TARIFA_SUBSIDIADA, SUBSIDIO_MONETARIO, VALIDACION_AFILIACION]
    Result:
      type: string
      enum: [AFILIADO_OTRA_CAJA, NO_AFILIADO, INDETERMINADO]
    Match:
      type: object
      required: [caja, validFrom, validTo, source, asOf]
      properties:
        caja: { type: string, example: NORTE }
        validFrom: { type: string, format: date, nullable: true }
        validTo: { type: string, format: date, nullable: true, description: null si la afiliación sigue vigente }
        source: { type: string, enum: [ONLINE, FILE] }
        asOf: { type: string, format: date, description: Fecha de corte del dato }
    MatchV2:
      allOf:
        - $ref: '#/components/schemas/Match'
        - type: object
          required: [affiliateType]
          properties:
            affiliateType: { type: string, enum: [DEPENDIENTE, INDEPENDIENTE, PENSIONADO], nullable: true }
    AffiliationResponseV1:
      type: object
      required: [requestId, result, matches, unavailable]
      properties:
        requestId: { type: string }
        result: { $ref: '#/components/schemas/Result' }
        matches: { type: array, items: { $ref: '#/components/schemas/Match' } }
        unavailable: { type: array, items: { type: string }, description: Cajas que no respondieron a tiempo }
    AffiliationResponseV2:
      type: object
      required: [requestId, result, matches, unavailable]
      properties:
        requestId: { type: string }
        result: { $ref: '#/components/schemas/Result' }
        matches: { type: array, items: { $ref: '#/components/schemas/MatchV2' } }
        unavailable: { type: array, items: { type: string } }
    BatchAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, DONE] }
    BatchResult:
      type: object
      required: [document, documentInput, result, matches, unavailable]
      properties:
        document: { type: string, description: Documento normalizado }
        documentInput: { type: string, description: Documento tal como venía en el archivo }
        result: { type: string, enum: [AFILIADO_OTRA_CAJA, NO_AFILIADO, INDETERMINADO, DOCUMENTO_INVALIDO] }
        matches: { type: array, items: { $ref: '#/components/schemas/Match' } }
        unavailable: { type: array, items: { type: string } }
    BatchJob:
      type: object
      required: [jobId, status, total, processed, results]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, DONE] }
        total: { type: integer }
        processed: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/BatchResult' } }
    AuditEntry:
      type: object
      required: [timestamp, requestId, requestingCaja, purpose, result, documentMasked, channel]
      properties:
        timestamp: { type: string, format: date-time }
        requestId: { type: string, description: requestId de la consulta o jobId del lote }
        requestingCaja: { type: string }
        purpose: { $ref: '#/components/schemas/Purpose' }
        result: { type: string }
        documentMasked: { type: string, example: '******1472' }
        channel: { type: string, enum: [ONLINE, BATCH] }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: Código del error, example: NO_AUTENTICADO }
        message: { type: string }
